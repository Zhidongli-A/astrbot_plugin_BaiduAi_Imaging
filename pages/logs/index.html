<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务日志</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 百度AI生图服务日志</h1>
            <div class="controls">
                <span id="status" class="status disconnected">未连接</span>
                <button id="clearBtn" class="btn">清空日志</button>
                <button id="autoScrollBtn" class="btn active">自动滚动</button>
            </div>
        </div>
        <div id="logContainer" class="log-container">
            <div class="log-placeholder">等待连接...</div>
        </div>
        <div class="stats">
            <span id="logCount">日志条数: 0</span>
            <span id="lastUpdate">最后更新: --</span>
        </div>
    </div>
    <script type="module" src="./app.js"></script>
</body>
</html>
